worker_processes      16;
worker_rlimit_nofile  100000;

events {
    worker_connections  8192;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    client_max_body_size    25M;
    client_body_timeout     120s;
    send_timeout            120s;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 512k;
    proxy_read_timeout      120s;
    proxy_send_timeout      120s;
    proxy_request_buffering off;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 500;
    gzip_comp_level 5;
    gzip_vary on;

    upstream fastapi {
        server server:8000;
        keepalive 256;
        keepalive_requests 1000;
        keepalive_timeout  65s;
    }

    upstream admin_panel {
        server admin-panel:3000;
    }

    upstream supervisor_panel {
        server supervisor-panel:3001;
    }

    server {
        listen 80;

        # Pre-generated ZIPs: nginx serves directly from filesystem, FastAPI not involved
        location /staged-zips/ {
            alias /biometrics/staged/;
            sendfile on;
            tcp_nopush on;
            add_header Cache-Control "no-store";
            add_header Content-Disposition "attachment";
        }

        # ── API routes ─────────────────────────────────────────────────────
        location /admin/ {
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /supervisor/ {
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /operator/ {
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /load/ {
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /docs {
            proxy_pass         http://fastapi;
            proxy_set_header   Host $host;
        }

        location /openapi.json {
            proxy_pass         http://fastapi;
            proxy_set_header   Host $host;
        }

        # ── Supervisor Panel static files ──────────────────────────────────
        location /sp/ {
            proxy_pass         http://supervisor_panel/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── Admin Panel static files (root) ───────────────────────────────
        location / {
            proxy_pass         http://admin_panel;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }
}
